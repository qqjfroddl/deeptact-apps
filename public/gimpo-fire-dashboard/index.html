        // 행정동 이름 (긴 이름부터 비교해야 '장기본동'이 '장기동'으로 잘못 잡히지 않는다)
        const ADMIN_DONGS = GIMPO_GEO.features.map(f => f.properties.name).sort((a, b) => b.length - a.length);

        // 법정동 → 대표 행정동 (화재 원자료는 법정동으로 오는 경우가 많다. 감정동은 일부가 장기본동에 걸친다)

        // 화재 건수 단계색 — 헤더 그라데이션(blue→purple)과 같은 계열
        const RAMP_LIGHT = ['#F1F5F9', '#DBEAFE', '#93C5FD', '#3B82F6', '#6366F1', '#7C3AED'];

        // 3. 커스텀 토스트 알림 제어 함수
        function showNotification(message, isSuccess = true) {

        // 4. 수치 및 통계 업데이트 함수
        function updateSummaryCards(data) {
            const total = data.length;
            const casualties = data.reduce((acc, curr) => acc + (Number(curr.casualties) || 0), 0);
            const deaths = data.reduce((acc, curr) => acc + (Number(curr.deaths) || 0), 0);
            const injuries = data.reduce((acc, curr) => acc + (Number(curr.injuries) || 0), 0);

            document.getElementById('stat-damage').textContent = `${damage.toLocaleString()}천원`;
        }

        // 5. Leaflet 지도 — 읍면동 경계를 화재 건수에 따라 색칠
        function pointInRing(x, y, ring) {
            let inside = false;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const [xi, yi] = ring[i], [xj, yj] = ring[j];
                if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
            }
            return inside;
        }
        function pointInPolygon(x, y, poly) {
            if (!pointInRing(x, y, poly[0])) return false;
            for (let k = 1; k < poly.length; k++) if (pointInRing(x, y, poly[k])) return false;
            return true;
        }
        function dongAtPoint(lat, lng) {
            for (const f of GIMPO_GEO.features) {
                if (f.geometry.coordinates.some(p => pointInPolygon(lng, lat, p))) return f.properties.name;
            }
            return null;
        }
        function ringArea(ring) {
            let a = 0;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) a += (ring[j][0] + ring[i][0]) * (ring[j][1] - ring[i][1]);
            return Math.abs(a / 2);
        }
        function distToSegment(px, py, [ax, ay], [bx, by]) {
            const dx = bx - ax, dy = by - ay;
            const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1)));
            return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
        }
        // 다각형 안쪽에서 가장자리와 가장 먼 점 — 동 이름 라벨이 경계 밖으로 나가지 않게
        function labelPoint(feature) {
            const poly = feature.geometry.coordinates.reduce((a, b) => ringArea(b[0]) > ringArea(a[0]) ? b : a);
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const [x, y] of poly[0]) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
            let best = null, bestD = -1;
            const N = 28;
            for (let i = 1; i < N; i++) for (let j = 1; j < N; j++) {
                const x = minX + (maxX - minX) * i / N, y = minY + (maxY - minY) * j / N;
                if (!pointInPolygon(x, y, poly)) continue;
                let d = Infinity;
                for (const r of poly) for (let k = 0; k < r.length - 1; k++) d = Math.min(d, distToSegment(x, y, r[k], r[k + 1]));
                if (d > bestD) { bestD = d; best = [y, x]; }
            }
            return best || [(minY + maxY) / 2, (minX + maxX) / 2];
        }
        const LABEL_POS = Object.fromEntries(GIMPO_GEO.features.map(f => [f.properties.name, labelPoint(f)]));

        // 0건을 뺀 최대값을 최대 5단계로 균등 분할
        function makeBreaks(max) {
            if (max <= 0) return [];
            const step = Math.ceil(max / Math.min(5, max));
            const b = [];
            for (let v = step; v < max; v += step) b.push(v);
            b.push(max);
            return b;
        }
        function classOf(n, breaks) {
            if (!n) return 0;
            for (let i = 0; i < breaks.length; i++) if (n <= breaks[i]) return i + 1;
            return breaks.length;
        }

        function initOrUpdateMap(isDarkTheme) {
            const mapContainer = document.getElementById('map');
            if (!mapContainer) return;

            // 지도 초기 객체 생성
            if (!mapInstance) {

                mapInstance = window.L.map('map', { zoomSnap: 0.25, minZoom: 9, maxZoom: 18 }).setView([37.64, 126.67], 11);
                // 확대하면 동 색칠을 연하게 → 거리와 화재 지점이 드러난다
                mapInstance.on('zoomend', () => { if (geoLayerInstance) geoLayerInstance.eachLayer(l => geoLayerInstance.resetStyle(l)); });

            // 기존 타일 레이어 제거 후 재생성
            if (tileLayerInstance) {
                mapInstance.removeLayer(tileLayerInstance);

            // CARTO 타일은 API 키 없이 쓰면 'API KEY REQUIRED' 워터마크만 내려온다(지도 깨짐의 원인).
            // 키가 필요 없는 Esri 회색 배경으로 교체.
            const tileUrl = isDarkTheme

                : 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';

            tileLayerInstance = window.L.tileLayer(tileUrl, {

            }).addTo(mapInstance);
            tileLayerInstance.bringToBack();

            // 14단계 이상 확대하면 위성사진으로 자동 전환 (건물 단위 확인용, 키 불필요)
            if (!imageryLayerInstance) {
                imageryLayerInstance = window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {

                    maxNativeZoom: 18,

            // 지도 크기 재계산 (웹 렌더링 시 타일 깨짐/회색 화면 현상 해결)
            setTimeout(() => {
                if (mapInstance) {
                    mapInstance.invalidateSize();
                }
            }, 200);

            // 읍면동별 집계
            const stats = {};
            ADMIN_DONGS.forEach(name => { stats[name] = { n: 0, casualties: 0, deaths: 0, injuries: 0, damage: 0 }; });
            currentFireData.forEach(item => {
                if (!item.town || !stats[item.town]) return;
                const s = stats[item.town];
                s.n++; s.casualties += item.casualties; s.deaths += item.deaths; s.injuries += item.injuries; s.damage += item.damage;
            });
            const breaks = makeBreaks(Math.max(0, ...Object.values(stats).map(s => s.n)));
            const ramp = isDarkTheme ? RAMP_DARK : RAMP_LIGHT;
            const edge = isDarkTheme ? '#0f172a' : '#ffffff';

            // 경계 레이어 (처음 한 번 생성, 이후 스타일만 갱신)
            if (!geoLayerInstance) {
                geoLayerInstance = window.L.geoJSON(GIMPO_GEO, {
                    onEachFeature: (feature, layer) => {
                        layer.on({
                            mouseover: () => { layer.setStyle({ weight: 3, color: '#8B5CF6' }); layer.bringToFront(); },
                            mouseout: () => geoLayerInstance.resetStyle(layer)

                }).addTo(mapInstance);
                mapInstance.fitBounds(geoLayerInstance.getBounds(), { padding: [16, 16] });
                labelLayerInstance = window.L.layerGroup().addTo(mapInstance);

            geoLayerInstance.options.style = feature => ({
                fillColor: ramp[classOf(stats[feature.properties.name].n, breaks)],

                weight: 1.5

            geoLayerInstance.eachLayer(layer => {
                geoLayerInstance.resetStyle(layer);
                const name = layer.feature.properties.name;
                const s = stats[name];
                layer.bindPopup(`
                    <div class="p-1 min-w-[170px] text-xs font-sans">
                        <h3 class="text-sm font-bold text-blue-600 dark:text-blue-400 mb-1">${name}</h3>
                        <p class="text-slate-600 dark:text-slate-300 font-medium">화재 발생 <span class="font-bold">${s.n}건</span></p>
                        <div class="mt-2 pt-2 border-t border-gray-200 dark:border-slate-700 space-y-1">
                            <p class="${s.casualties > 0 ? 'text-red-500 font-semibold' : 'text-slate-500'}">인명피해: ${s.casualties}명</p>
                            <p class="text-slate-400 text-[10px]">(사망: ${s.deaths}명 / 부상: ${s.injuries}명)</p>
                            <p class="text-slate-500 dark:text-slate-400 mt-1">재산피해: <span class="font-bold text-slate-700 dark:text-slate-200">${s.damage.toLocaleString()}천원</span></p>
                        </div>

            items.push('<span class="flex items-center"><i class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1.5"></i>인명피해 발생</span>');
            if (currentFireData.some(d => d.lat != null)) {
                items.push('<span class="flex items-center"><i class="inline-block w-2.5 h-2.5 rounded-full bg-blue-500 ring-1 ring-white mr-1.5"></i>화재 지점</span>');
                items.push('<span class="flex items-center"><i class="inline-block w-2.5 h-2.5 rounded-full border-2 border-dashed border-blue-500 mr-1.5"></i>도로 단위 추정</span>');
            }
            legend.innerHTML = items.join('');

            // 기존 마커 전체 리셋 — 좌표가 있는 행(엑셀 위도·경도 또는 주소 검색 결과)만 점으로 표시
            mapMarkers.forEach(marker => mapInstance.removeLayer(marker));
            mapMarkers = [];

            // 같은 지점의 화재는 점 하나로 묶는다
            const spots = {};
            currentFireData.filter(item => item.lat != null).forEach(item => {
                const key = item.lat.toFixed(5) + ',' + item.lng.toFixed(5);
                (spots[key] = spots[key] || []).push(item);
            });

            Object.values(spots).forEach(items => {
                const first = items[0];
                const casualties = items.reduce((acc, d) => acc + d.casualties, 0);
                const approx = first.geoLevel === 'road';
                const baseColor = casualties > 0 ? '#EF4444' : '#3B82F6';
                const circleMarker = window.L.circleMarker([first.lat, first.lng], {
                    radius: Math.min(6 + (items.length - 1) * 2, 14),
                    fillColor: baseColor,
                    color: approx ? baseColor : '#ffffff',
                    weight: approx ? 2 : 1.5,
                    dashArray: approx ? '3 3' : null,
                    opacity: 1,
                    fillOpacity: approx ? 0.25 : 0.85
                }).addTo(mapInstance);

                const precision = first.geoLevel === 'file' ? '엑셀 좌표'
                    : first.geoLevel === 'exact' ? '주소 위치 확인'
                    : '도로 단위 추정 (건물 위치 아님)';
                const rowsHtml = items.slice(0, 5).map(item => `
                        <div class="mt-2 pt-2 border-t border-gray-200 dark:border-slate-700 space-y-1">
                            <p class="text-slate-600 dark:text-slate-300 font-medium">${item.date || ''} ${item.time || ''} · ${item.place || '기타'} &gt; ${item.placeDetail || '상세없음'}</p>
                            ${items.length > 1 && item.address ? `<p class="text-slate-400 text-[10px]">${item.address}</p>` : ''}
                            <p class="${item.casualties > 0 ? 'text-red-500 font-semibold' : 'text-slate-500'}">인명피해: ${item.casualties}명</p>
                            <p class="text-slate-400 text-[10px]">(사망: ${item.deaths}명 / 부상: ${item.injuries}명)</p>
                            <p class="text-slate-500 dark:text-slate-400 mt-1">재산피해: <span class="font-bold text-slate-700 dark:text-slate-200">${(item.damage || 0).toLocaleString()}천원</span></p>
                        </div>`).join('');

                const popupContent = `
                    <div class="p-1 min-w-[190px] max-w-[260px] text-xs font-sans">
                        <h3 class="text-sm font-bold text-blue-600 dark:text-blue-400 mb-1">${first.town || '위치'}${items.length > 1 ? ` · ${items.length}건` : ''}</h3>
                        ${items.length === 1 && first.address ? `<p class="text-slate-500 dark:text-slate-400">${first.address}</p>` : ''}
                        <p class="text-[10px] ${approx ? 'text-amber-500' : 'text-emerald-600 dark:text-emerald-400'} font-medium">● ${precision}</p>
                        ${rowsHtml}
                        ${items.length > 5 ? `<p class="mt-2 text-slate-400 text-[10px]">외 ${items.length - 5}건</p>` : ''}
                    </div>
                `;

                circleMarker.bindPopup(popupContent, { className: 'custom-popup' });
                mapMarkers.push(circleMarker);
            });

            // 주소 검색 진행 상황 > 지역 미확인 안내 순으로 표시
            document.getElementById('map-badge').textContent = geoStatus ? geoStatus : unmatchedCount > 0
                ? `* 지역 미확인 ${unmatchedCount}건은 지도에서 제외 (요약 수치에는 포함)`
                : '* 행정동 경계 기준 · 색이 진할수록 화재 다발';
        }

        // 6. 데이터 기반 파이 차트 가공 및 렌더링
        function renderPlaceChart() {
            const ctx = document.getElementById('place-chart').getContext('2d');
            
            const counts = {};
            currentFireData.forEach(d => {
                const p = d.place || '기타';
                counts[p] = (counts[p] || 0) + 1;
            });

            // 색이 6개뿐이라 상위 5개 + 나머지는 '기타'로 묶는다 (색 반복 방지)
            let entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            if (entries.length > 6) {
                const rest = entries.slice(5).reduce((acc, [, n]) => acc + n, 0);
                entries = [...entries.slice(0, 5), ['기타', rest]];
            }
            const labels = entries.map(e => e[0]);
            const data = entries.map(e => e[1]);

            if (placeChartInstance) {
                placeChartInstance.destroy();
            }

            placeChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: CHART_COLORS,
                        borderWidth: isDarkMode ? 2 : 1,
                        borderColor: isDarkMode ? '#1e293b' : '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: isDarkMode ? '#f8fafc' : '#334155',
                                font: { family: 'Noto Sans KR', size: 12 }
                            }
                        }
                    }
                }
            });
        }

        // 7. 데이터 기반 바 차트 가공 및 렌더링
        function renderTimeChart() {
            const ctx = document.getElementById('time-chart').getContext('2d');

            const hours = Array(24).fill(0);
            currentFireData.forEach(d => {
                if (d.time) {
                    const hour = parseInt(d.time.split(':')[0], 10);
                    if (!isNaN(hour)) {
                        hours[hour]++;
                    }
                }
            });

            const labels = Array.from({ length: 24 }, (_, i) => `${i}시`);

            if (timeChartInstance) {
                timeChartInstance.destroy();
            }

            // 그라데이션 색상 설정
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, '#8B5CF6');
            gradient.addColorStop(1, '#3B82F6');

            timeChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '발생 건수',
                        data: hours,
                        backgroundColor: gradient,
                        borderRadius: 6,
                        borderSkipped: false,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: {
                                color: isDarkMode ? '#94a3b8' : '#64748b',
                                font: { family: 'Inter', size: 11 }
                            }
                        },
                        y: {
                            grid: {
                                color: isDarkMode ? 'rgba(148, 163, 184, 0.08)' : 'rgba(100, 116, 139, 0.08)'
                            },
                            ticks: {
                                stepSize: 1,
                                color: isDarkMode ? '#94a3b8' : '#64748b',
                                font: { family: 'Inter', size: 11 }
                            }
                        }
                    }
                }
            });
        }

        // 8. 테마 변경 적용 및 일괄 재조정 함수
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const body = document.body;
            const themeIcon = document.getElementById('theme-icon');

            if (isDarkMode) {
                document.documentElement.classList.add('dark'); // Tailwind dark:는 .dark의 자식에만 적용되므로 html에 붙인다
                body.style.backgroundColor = '#0f172a'; // 다크모드 진한 네이비 배경 적용
                // Sun 아이콘 구현
                themeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                `;
            } else {
                document.documentElement.classList.remove('dark');
                body.style.backgroundColor = '';
                // Moon 아이콘 구현
                themeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                `;
            }

            // 지도 및 차트 테마 업데이트
            initOrUpdateMap(isDarkMode);
            renderPlaceChart();
            renderTimeChart();
        }

        // 9. 업로드 파일 데이터 파싱 — 열 순서가 아니라 '열 제목'으로 인식
        const COLUMN_RULES = {
            id:          [/화재\s*번호/, /^번호$/, /^id$/i],
            town:        [/읍\s*면\s*동/, /행정\s*동/, /법정\s*동/, /^동$/],
            road:        [/도로명\s*주소/],
            jdong:       [/지번\s*동/],
            jri:         [/지번\s*리/],
            detail:      [/세부\s*주소/],
            addr:        [/주소/, /소재지/, /발생\s*위치/, /^위치$/, /발생\s*장소$/],
            sgg:         [/시\s*군\s*구/],
            lat:         [/위도/, /^lat(itude)?$/i],
            lng:         [/경도/, /^(lng|lon|long|longitude)$/i],
            casualties:  [/인명\s*피해/],
            deaths:      [/사망/],
            injuries:    [/부상/],
            damage:      [/재산\s*피해.*(소계|합계|계)/, /재산\s*피해/, /피해\s*액/],
            datetime:    [/발생\s*일시/, /년\s*[월원]\s*일/, /발생\s*일자/, /일시/, /일자/, /날짜/],
            year:        [/^발생\s*년도?$/, /^년도?$/],
            mon:         [/^발생\s*월$/, /^월$/],
            day:         [/^발생\s*일$/, /^일$/],
            hour:        [/^발생\s*시$/, /^시$/, /발생\s*시각/, /발생\s*시간/],
            minute:      [/^발생\s*분$/, /^분$/],
            place:       [/장소\s*대\s*분류/, /발화\s*장소/, /장소\s*구분/, /^장소$/],
            placeDetail: [/장소\s*소\s*분류/, /장소\s*중\s*분류/, /장소\s*상세/]
        };

        // 제목 줄을 못 찾을 때: 국가화재정보 원자료 열 순서 (원래 대시보드가 가정한 위치)
        const LEGACY_INDEX = { id: 0, casualties: 1, deaths: 2, injuries: 3, damage: 4, datetime: 7, hour: 11, minute: 12, sgg: 15, town: 16, place: 31, placeDetail: 33 };

        const norm = v => String(v ?? '').replace(/\s+/g, ' ').trim();

        function toNumber(v) {
            if (v == null || v === '') return 0;
            if (typeof v === 'number') return isFinite(v) ? v : 0;
            const n = Number(String(v).replace(/[,\s원천]/g, ''));
            return isFinite(n) ? n : 0;
        }

        function findHeaderRow(aoa) {
            let best = { idx: -1, score: 0 };
            for (let i = 0; i < Math.min(aoa.length, 15); i++) {
                let score = 0;
                for (const cell of (aoa[i] || [])) {
                    const t = norm(cell);
                    if (t && t.length <= 30 && Object.values(COLUMN_RULES).some(rs => rs.some(r => r.test(t)))) score++;
                }
                if (score > best.score) best = { idx: i, score };
            }
            return best.score >= 2 ? best.idx : -1;
        }

        function mapColumns(header) {
            const cols = {};
            const used = new Set();
            for (const [key, rules] of Object.entries(COLUMN_RULES)) {
                for (const r of rules) {
                    const idx = header.findIndex((h, i) => !used.has(i) && r.test(norm(h)));
                    if (idx >= 0) { cols[key] = idx; used.add(idx); break; }
                }
            }
            if (cols.addr != null && /분류/.test(norm(header[cols.addr]))) delete cols.addr;
            return cols;
        }

        // Date 객체, 엑셀 일련번호, '2025-01-01 08:49', '20250101', '2025.1.1' 모두 처리
        function parseDateTime(v) {
            if (v == null || v === '') return null;
            if (v instanceof Date && !isNaN(v)) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate(), hh: v.getHours(), mi: v.getMinutes(), hasTime: v.getHours() + v.getMinutes() > 0 };
            if (typeof v === 'number' && v > 20000 && v < 80000) {
                const p = window.XLSX.SSF.parse_date_code(v);
                if (p) return { y: p.y, m: p.m, d: p.d, hh: p.H, mi: p.M, hasTime: (v % 1) !== 0 };
            }
            const s = String(v).trim();
            let m = s.match(/(\d{4})[-./년\s]*(\d{1,2})[-./월\s]*(\d{1,2})(?:[^\d]+(\d{1,2})\s*[:시]\s*(\d{1,2}))?/);
            if (!m) m = s.match(/^(\d{4})(\d{2})(\d{2})(?:\D*(\d{2})(\d{2}))?/);
            if (!m || +m[2] < 1 || +m[2] > 12) return null;
            return { y: +m[1], m: +m[2], d: +m[3], hh: m[4] != null ? +m[4] : null, mi: m[5] != null ? +m[5] : 0, hasTime: m[4] != null };
        }

        function resolveTown(...texts) {
            for (const raw of texts) {
                const t = norm(raw).replace(/\s/g, '');
                if (!t) continue;
                for (const name of ADMIN_DONGS) if (t.includes(name)) return name;
                for (const [legal, admin] of Object.entries(LEGAL_TO_ADMIN)) if (t.includes(legal)) return admin;
            }
            return null;
        }

        function processDataRows(aoa) {
            const headerIdx = findHeaderRow(aoa);
            let cols = headerIdx >= 0 ? mapColumns(aoa[headerIdx]) : null;
            let body = headerIdx >= 0 ? aoa.slice(headerIdx + 1) : [];
            if (!cols || (cols.town == null && cols.addr == null && cols.lat == null)) {
                const wide = aoa.filter(r => r && r.length > 16).length;
                if (wide >= Math.max(1, aoa.length * 0.5)) {
                    cols = LEGACY_INDEX;
                    body = aoa.slice(1);
                } else {
                    showNotification("읍면동·주소 열을 찾지 못했습니다. 첫 줄 제목을 확인해 주세요.", false);
                    return;
                }
            }

            const get = (row, key) => cols[key] != null ? row[cols[key]] : undefined;
            const parsedData = [];
            let outside = 0;
            for (const r of body) {
                if (!r || r.every(c => c == null || norm(c) === '')) continue;

                // 시군구 칸이 김포가 아니면 집계 대상에서 뺀다
                const sgg = norm(get(r, 'sgg'));
                if (sgg && !/김포/.test(sgg)) { outside++; continue; }

                let dt = parseDateTime(get(r, 'datetime'));
                if (!dt && cols.year != null && cols.mon != null) {
                    const y = toNumber(get(r, 'year')), mo = toNumber(get(r, 'mon'));
                    if (y > 1900 && mo >= 1 && mo <= 12) dt = { y, m: mo, d: toNumber(get(r, 'day')) || 1, hasTime: false };
                }
                let hour = dt && dt.hasTime ? dt.hh : null;
                let minute = dt && dt.hasTime ? dt.mi : 0;
                if (cols.hour != null && norm(get(r, 'hour')) !== '') { hour = toNumber(get(r, 'hour')); minute = toNumber(get(r, 'minute')); }

                const deaths = toNumber(get(r, 'deaths'));
                const injuries = toNumber(get(r, 'injuries'));
                const lat = toNumber(get(r, 'lat')), lng = toNumber(get(r, 'lng'));
                const hasPoint = lat > 33 && lat < 39 && lng > 124 && lng < 132;
                const rawLocation = norm(get(r, 'town')) || norm(get(r, 'addr'));
                const town = resolveTown(get(r, 'jdong'), get(r, 'town'), get(r, 'addr')) || (hasPoint ? dongAtPoint(lat, lng) : null);

                parsedData.push({
                    id: norm(get(r, 'id')),
                    casualties: cols.casualties != null ? Math.max(toNumber(get(r, 'casualties')), deaths + injuries) : deaths + injuries,
                    deaths,
                    injuries,
                    damage: toNumber(get(r, 'damage')),
                    date: dt ? `${dt.y}-${String(dt.m).padStart(2, '0')}-${String(dt.d).padStart(2, '0')}` : '',
                    time: hour != null && hour >= 0 && hour <= 23 ? `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}` : '',
                    location: rawLocation || 'Unknown',
                    roadAddr: norm(get(r, 'road')),
                    jdong: norm(get(r, 'jdong')),
                    legalDong: norm(get(r, 'town')),
                    jri: norm(get(r, 'jri')),
                    detail: norm(get(r, 'detail')),
                    address: [norm(get(r, 'town')), norm(get(r, 'jri')), norm(get(r, 'detail')), norm(get(r, 'road'))].filter(Boolean).join(' ') || norm(get(r, 'addr')),
                    geoLevel: hasPoint ? 'file' : null,
                    place: norm(get(r, 'place')) || '기타',
                    placeDetail: norm(get(r, 'placeDetail')),
                    town: town || '',
                    lat: hasPoint ? lat : null,
                    lng: hasPoint ? lng : null
                });
            }

            if (parsedData.length > 0) {
                currentFireData = parsedData;
                const unmatched = parsedData.filter(d => !d.town);
                unmatchedCount = unmatched.length;
                if (unmatched.length) console.warn('지역 미확인 행:', unmatched.map(d => d.location));
                updateSummaryCards(currentFireData);
                initOrUpdateMap(isDarkMode);
                renderPlaceChart();
                renderTimeChart();
                let msg = `${parsedData.length}건의 화재 분석 정보가 정상적으로 로드되었습니다.`;
                if (unmatched.length) msg += ` (지역 미확인 ${unmatched.length}건)`;
                if (outside) msg += ` 김포시 외 ${outside}건 제외.`;
                showNotification(msg, unmatched.length === 0);
                geocodeAddresses();
            } else {
                showNotification("가져올 수 있는 유효한 데이터 행이 존재하지 않습니다.", false);
            }
        }

        // 9-1. 주소 → 좌표 검색 (OpenStreetMap Nominatim — 키 불필요, 이용 정책상 1초에 1건)
        //  · 도로명주소 → 지번 순으로 찾고, 김포 경계 밖으로 잡힌 결과는 버린다
        //  · 건물번호까지 맞으면 'exact', 도로만 맞으면 'road'(점선 표시), 그 외는 점을 찍지 않는다
                //  · 새로 찾은 주소는 이 브라우저에 기억해 다음 업로드 때 바로 표시
        // 공개 배포본: 실제 화재 주소가 노출되지 않도록 미리 찾은 좌표는 싣지 않는다 (첫 업로드 때 검색 후 브라우저에 기억)
        const SEED_GEO_CACHE = {};
        const GEO_CACHE_KEY = 'gimpo-fire-geocode-v1';
        const GIMPO_VIEWBOX = '126.50,37.80,126.83,37.54';
        let geoCache = { ...SEED_GEO_CACHE };
        try { Object.assign(geoCache, JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || '{}')); } catch (e) { /* 저장소 없는 환경 */ }
        let geocodeRunId = 0;
        let geoStatus = '';

        function saveGeoCache() {
            // 기본 내장분(SEED)은 빼고 새로 찾은 것만 저장
            const mine = {};
            Object.keys(geoCache).forEach(k => { if (!(k in SEED_GEO_CACHE)) mine[k] = geoCache[k]; });
            try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(mine)); } catch (e) { /* 저장 불가 환경은 무시 */ }
        }

        // 질의 문자열 규칙 — 미리 찾아 둔 SEED(파이썬 geocode_real.py)와 반드시 같아야 한다
        function buildQueries(item) {
            const qs = [];
            const road = norm(norm(item.roadAddr).replace(/[()]/g, ' '));
            if (/\d/.test(road)) qs.push('경기도 김포시 ' + road);
            const m = norm(item.detail).match(/^(산\s*)?\d+(-\d+)?/);
            if (m) {
                // 지번 주소는 법정동 기준 (국가화재정보 원자료의 '읍면동' 열이 법정동, '지번동' 열이 행정동)
                const parts = [norm(item.legalDong || item.jdong), norm(item.jri), norm(m[0])].filter(Boolean);
                qs.push('경기도 김포시 ' + parts.join(' '));
            }
            // 다른 양식: 일반 '주소' 열
            if (!qs.length && !item.roadAddr && !item.detail && /\d/.test(item.address || '')) {
                const a = norm(item.address.replace(/\(.*?\)/g, ' '));
                qs.push(/김포/.test(a) ? a : '경기도 김포시 ' + a);
            }
            return qs;
        }

        async function searchAddress(q) {
            const params = new URLSearchParams({
                q, format: 'jsonv2', limit: '1', addressdetails: '1',
                countrycodes: 'kr', viewbox: GIMPO_VIEWBOX, bounded: '1', 'accept-language': 'ko'
            });
            const res = await fetch('https://nominatim.openstreetmap.org/search?' + params.toString());
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const hit = (await res.json())[0];
            if (!hit) return null;
            const lat = Number(hit.lat), lng = Number(hit.lon);
            if (!dongAtPoint(lat, lng)) return null; // 김포 밖
            if (hit.address && hit.address.house_number) return { lat, lng, level: 'exact' };
            if (hit.category === 'highway' || hit.addresstype === 'road') return { lat, lng, level: 'road' };
            if (['building', 'amenity', 'shop', 'office'].includes(hit.category)) return { lat, lng, level: 'exact' };
            return null; // 동·리 단위 결과는 동 색칠로 충분
        }

        // 캐시에서 행별 최선의 결과(정확 > 도로)를 골라 적용
        function applyGeoResults() {
            currentFireData.forEach(item => {
                if (item.geoLevel === 'file') return;
                let best = null;
                for (const q of buildQueries(item)) {
                    const hit = geoCache[q];
                    if (hit && hit.lat != null) {
                        if (hit.level === 'exact') { best = hit; break; }
                        if (!best) best = hit;
                    }
                }
                if (best) {
                    item.lat = best.lat; item.lng = best.lng; item.geoLevel = best.level;
                    if (!item.town) item.town = dongAtPoint(best.lat, best.lng) || '';
                }
            });
            unmatchedCount = currentFireData.filter(d => !d.town).length;
        }

        async function geocodeAddresses() {
            const runId = ++geocodeRunId;
            // 아직 정확한 지점을 못 찾았고, 시도해 보지 않은 질의가 남은 행만
            const pendingQueries = [];
            currentFireData.forEach(item => {
                if (item.geoLevel === 'file') return;
                for (const q of buildQueries(item)) {
                    const hit = geoCache[q];
                    if (hit && hit.level === 'exact') break;
                    if (!(q in geoCache) && !pendingQueries.includes(q)) { pendingQueries.push(q); break; }
                }
            });

            applyGeoResults();
            geoStatus = '';
            initOrUpdateMap(isDarkMode);
            if (pendingQueries.length === 0) {
                if (currentFireData.some(d => d.lat != null)) geoStatus = summaryGeoStatus();
                initOrUpdateMap(isDarkMode);
                return;
            }

            // 한 질의가 실패하면 그 행의 다음 질의(지번)를 이어서 시도하도록 큐를 늘린다
            let done = 0;
            for (let i = 0; i < pendingQueries.length; i++) {
                if (runId !== geocodeRunId) return; // 새 파일이 올라오면 중단
                const q = pendingQueries[i];
                geoStatus = `* 주소 위치 찾는 중 ${done}/${pendingQueries.length}`;
                document.getElementById('map-badge').textContent = geoStatus;
                try {
                    geoCache[q] = (await searchAddress(q)) || { none: true };
                } catch (error) {
                    console.error(error);
                    geoStatus = `* 주소 위치 검색 중단 (네트워크 또는 이용 제한) — ${done}건 완료`;
                    saveGeoCache();
                    applyGeoResults();
                    initOrUpdateMap(isDarkMode);
                    return;
                }
                done++;
                if (geoCache[q].level !== 'exact') {
                    currentFireData.forEach(item => {
                        const qs = buildQueries(item);
                        const at = qs.indexOf(q);
                        const next = at >= 0 ? qs[at + 1] : null;
                        if (next && !(next in geoCache) && !pendingQueries.includes(next)) pendingQueries.push(next);
                    });
                }
                if (done % 5 === 0) {
                    saveGeoCache();
                    applyGeoResults();
                    initOrUpdateMap(isDarkMode);
                }
                await new Promise(r => setTimeout(r, 1100)); // 이용 정책: 초당 1건
            }
            if (runId !== geocodeRunId) return;
            saveGeoCache();
            applyGeoResults();
            geoStatus = summaryGeoStatus();
            initOrUpdateMap(isDarkMode);
        }

        function summaryGeoStatus() {
            const exact = currentFireData.filter(d => d.geoLevel === 'exact' || d.geoLevel === 'file').length;
            const road = currentFireData.filter(d => d.geoLevel === 'road').length;
            const none = currentFireData.length - exact - road;
            return `* 지점 표시 ${exact}건 · 도로 단위 ${road}건 · 동 단위만 ${none}건 — 확대하면 지점 확인`;
        }

        // 10. 업로드 이벤트 핸들러 바인딩
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileExtension = file.name.split('.').pop().toLowerCase();
            if (!['xlsx', 'xls', 'csv'].includes(fileExtension)) {
                showNotification("지원하지 않는 파일 형식입니다.", false);
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    let workbook;
                    if (fileExtension === 'csv') {
                        // CSV는 한글 인코딩(UTF-8 / EUC-KR)을 판별해서 읽는다
                        const buf = new Uint8Array(e.target.result);
                        let text = new TextDecoder('utf-8').decode(buf);
                        if (text.includes('�')) text = new TextDecoder('euc-kr').decode(buf);
                        workbook = window.XLSX.read(text, { type: 'string', cellDates: true });
                    } else {
                        workbook = window.XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
                    }
                    // 데이터가 가장 많은 시트를 사용 (첫 시트가 표지인 경우 대비)
                    let jsonData = [];
                    workbook.SheetNames.forEach(name => {
                        const rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1, raw: true, defval: null });
                        if (rows.length > jsonData.length) jsonData = rows;
                    });
                    processDataRows(jsonData);
                } catch (error) {
                    console.error(error);
                    showNotification("엑셀 파일 파싱에 실패했습니다. 올바른 포맷인지 확인해 주세요.", false);
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 11. 초기 구동 실행
        window.addEventListener('DOMContentLoaded', () => {
            // 기본 라이트 모드 아이콘 적용
            const themeIcon = document.getElementById('theme-icon');
            themeIcon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            `;

            // 초기 대시보드 상태 설정 및 지도 렌더링
            updateSummaryCards(currentFireData);
            initOrUpdateMap(isDarkMode);
            renderPlaceChart();
            renderTimeChart();

            // 리스너 바인딩
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            document.getElementById('file-upload').addEventListener('change', handleFileUpload);

            // 창 크기 조절 시 지도가 정상 리사이즈되도록 이벤트 추가
            window.addEventListener('resize', () => {
                if (mapInstance) {
                    mapInstance.invalidateSize();
                }
            });
        });
    </script>
