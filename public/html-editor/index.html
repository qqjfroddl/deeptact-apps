<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 HTML 편집기</title>
<style>
  :root{
    --shell:#1d2027; --shell-2:#252933; --line:#333845;
    --ink:#e6e8ee; --ink-dim:#9aa1b1; --accent:#4c8bf5;
    --accent-soft:#1f3457; --danger:#e5604d; --ok:#3fb27f;
    --canvas:#eef0f3;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    color:var(--ink); background:var(--shell);
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ── 툴바 ── */
  .bar{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:8px 10px; background:var(--shell-2);
    border-bottom:1px solid var(--line);
  }
  .grp{display:flex; align-items:center; gap:4px}
  .sep{width:1px; height:22px; background:var(--line); margin:0 4px}
  button.tb{
    appearance:none; border:1px solid transparent; border-radius:7px;
    background:transparent; color:var(--ink); padding:6px 10px;
    font-size:13px; cursor:pointer; white-space:nowrap; line-height:1;
  }
  button.tb:hover{background:#30353f}
  button.tb:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  button.tb[disabled]{opacity:.38; cursor:not-allowed}
  button.tb.primary{background:var(--accent); color:#fff}
  button.tb.primary:hover{background:#3f7be0}
  button.tb.active{background:var(--accent-soft); color:#bcd3ff}
  button.tb.danger{color:var(--danger)}
  button.tb.danger:hover{background:#3a2522}
  .tb .k{font-size:11px; color:var(--ink-dim); margin-left:6px}
  .lbl{font-size:12px; color:var(--ink-dim)}
  .numin{
    width:64px; background:#1a1d24; color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:5px 7px;
    font-size:12px; text-align:right;
  }
  .numin:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .menu{position:relative}
  .menu>.pop{
    position:absolute; top:calc(100% + 6px); left:0; z-index:50;
    background:var(--shell-2); border:1px solid var(--line);
    border-radius:10px; padding:6px; min-width:190px;
    box-shadow:0 12px 34px rgba(0,0,0,.45); display:none;
  }
  .menu.open>.pop{display:block}
  .pop button{
    display:flex; width:100%; justify-content:space-between; gap:14px;
    align-items:center; background:transparent; border:0; color:var(--ink);
    padding:8px 10px; border-radius:7px; font-size:13px; cursor:pointer; text-align:left;
  }
  .pop button:hover{background:#30353f}
  .pop button .d{color:var(--ink-dim); font-size:11px}
  .pop .head{padding:4px 10px 6px; color:var(--ink-dim); font-size:11px; letter-spacing:.04em}

  .spacer{flex:1}
  .fname{font-size:12px; color:var(--ink-dim); max-width:240px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}

  /* ── 캔버스 ── */
  .stage{flex:1; position:relative; background:var(--canvas); overflow:hidden}
  iframe{width:100%; height:100%; border:0; background:#fff; display:block}
  .empty{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; color:#6b7280; text-align:center; padding:24px;
  }
  .empty h1{font-size:18px; color:#3b414d; margin:0; font-weight:600}
  .empty p{margin:0; max-width:420px; font-size:13px; line-height:1.6}
  .empty .drop{
    border:2px dashed #c2c8d2; border-radius:14px; padding:34px 46px;
    background:#f7f8fa; transition:.15s;
  }
  .empty.drag .drop{border-color:var(--accent); background:#eaf1fe}

  /* ── 상태바 ── */
  .status{
    display:flex; align-items:center; gap:12px; padding:6px 12px;
    background:var(--shell-2); border-top:1px solid var(--line);
    font-size:12px; color:var(--ink-dim); min-height:30px;
  }
  .status .sel{color:var(--ink)}
  .status .warn{color:#e3b341}
  .pill{font-size:11px; padding:2px 8px; border-radius:20px; background:#2a2f3a}
  .pill.on{background:var(--accent-soft); color:#bcd3ff}

  .toast{
    position:fixed; bottom:46px; left:50%; transform:translateX(-50%) translateY(8px);
    background:#2b3038; border:1px solid var(--line); color:var(--ink);
    padding:9px 16px; border-radius:9px; font-size:13px; opacity:0; pointer-events:none;
    transition:.2s; box-shadow:0 10px 30px rgba(0,0,0,.4); z-index:100;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--danger)}

  .copyright{
    text-align:center; padding:9px 12px; font-size:11px; line-height:1.65;
    color:var(--ink-dim); background:var(--shell); border-top:1px solid var(--line);
  }
  .copyright .tagline{color:#7e8696; font-style:italic}

  /* ── 슬라이드 미리보기 패널 ── */
  .work{flex:1; display:flex; min-height:0;}
  .slidebar{
    width:208px; flex:0 0 208px; background:var(--shell-2);
    border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden;
  }
  .slidebar.hidden{display:none;}
  .sb-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; font-size:12px; color:var(--ink-dim);
    border-bottom:1px solid var(--line);
  }
  .sb-head #sbCount{font-size:11px; color:#7e8696;}
  .sb-list{flex:1; min-height:0; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px;}
  .sb-list::-webkit-scrollbar{width:9px;}
  .sb-list::-webkit-scrollbar-thumb{background:#3a4150; border-radius:6px;}
  .sb-item{
    position:relative; cursor:pointer; border-radius:9px; overflow:hidden;
    border:2px solid transparent; background:#0f1116;
    transition:border-color .12s, transform .12s;
  }
  .sb-item:hover{border-color:#3a4254;}
  .sb-item.active{border-color:var(--accent);}
  .sb-num{
    position:absolute; top:5px; left:7px; z-index:2; font-size:10px; color:#fff;
    background:rgba(0,0,0,.55); padding:1px 7px; border-radius:10px; pointer-events:none;
  }
  .sb-thumb{position:relative; width:100%; height:0; padding-top:var(--ar-pad, 56.25%); background:#fff; overflow:hidden;}
  .sb-thumb iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; pointer-events:none;}
  .sb-empty{padding:16px 12px; color:var(--ink-dim); font-size:12px; line-height:1.6;}
  .sb-item{cursor:grab;}
  .sb-item.dragging{opacity:.45;}
  .sb-item.drag-over{border-color:var(--accent); box-shadow:0 -3px 0 0 var(--accent);}
  .sb-tools{position:absolute; top:4px; right:4px; z-index:3; display:none; gap:3px;}
  .sb-item:hover .sb-tools{display:flex;}
  .sb-tools button{
    width:21px; height:21px; padding:0; border:0; border-radius:5px; cursor:pointer;
    background:rgba(20,23,30,.82); color:#e6e8ee; font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .sb-tools button:hover{background:var(--accent); color:#fff;}
  .sb-tools button.del:hover{background:var(--danger); color:#fff;}
  .stage{min-width:0;}
</style>
</head>
<body>

<div class="bar">
  <div class="grp">
    <button class="tb primary" id="btnOpen">파일 열기</button>
    <div class="menu" id="saveMenu">
      <button class="tb" id="btnSave" disabled>저장 ▾</button>
      <div class="pop">
        <div class="head">저장 방식</div>
        <button data-act="overwrite">기존 파일에 덮어쓰기 <span class="d">Ctrl S</span></button>
        <button data-act="download">새 파일 다운로드 <span class="d">Ctrl ⇧ S</span></button>
      </div>
    </div>
  </div>

  <div class="sep"></div>
  <div class="grp">
    <button class="tb" id="btnUndo" disabled>실행취소<span class="k">Ctrl Z</span></button>
    <button class="tb" id="btnRedo" disabled>다시실행<span class="k">Ctrl Y</span></button>
  </div>

  <div class="sep"></div>
  <div class="grp" id="elemGrp">
    <button class="tb" data-act="editText" disabled>텍스트 편집</button>
    <button class="tb" data-act="moveUp" disabled>▲ 위로</button>
    <button class="tb" data-act="moveDown" disabled>▼ 아래로</button>
    <button class="tb" data-act="duplicate" disabled>복제</button>
    <button class="tb danger" data-act="delete" disabled>삭제</button>
  </div>

  <div class="sep"></div>
  <div class="menu" id="insMenu">
    <button class="tb" id="btnIns" disabled>＋ 삽입 ▾</button>
    <div class="pop">
      <div class="head">선택 요소 아래에 추가</div>
      <button data-ins="h2">제목 (H2)</button>
      <button data-ins="h3">소제목 (H3)</button>
      <button data-ins="p">문단</button>
      <button data-ins="ul">목록</button>
      <button data-ins="imgfile">이미지 (내 파일)</button>
      <button data-ins="img">이미지 (URL)</button>
      <button data-ins="hr">구분선</button>
    </div>
  </div>

  <div class="sep" id="imgSep" style="display:none"></div>
  <div class="grp" id="imgGrp" style="display:none">
    <span class="lbl">이미지 너비</span>
    <button class="tb" data-img="dec" title="10% 축소">−</button>
    <input class="numin" id="imgW" type="number" min="20" step="10" title="너비(px)">
    <span class="lbl">px</span>
    <button class="tb" data-img="inc" title="10% 확대">＋</button>
    <button class="tb" data-img="reset" title="원본 크기">원본</button>
    <button class="tb" data-img="center" id="imgCenterBtn" title="가운데 정렬">가운데</button>
  </div>

  <div class="sep"></div>
  <button class="tb" id="btnSidebar" title="슬라이드 미리보기 패널 토글" disabled>▣ 슬라이드</button>

  <div class="spacer"></div>
  <span class="fname" id="fname"></span>
</div>

<div class="work" id="work">
  <aside class="slidebar hidden" id="slidebar">
    <div class="sb-head"><span>슬라이드</span><span id="sbCount"></span></div>
    <div class="sb-list" id="sbList"></div>
  </aside>
  <div class="stage" id="stage">
  <iframe id="frame" title="강의 미리보기"></iframe>
  <div class="empty" id="empty">
    <div class="drop">
      <h1>강의 HTML 파일을 여세요</h1>
      <p>여기로 <b>.html 파일을 끌어다 놓거나</b> 좌측 상단의 <b>파일 열기</b>를 누르세요.
         요소를 <b>클릭</b>하면 선택, <b>더블클릭</b>하면 텍스트 편집, <b>끌면</b> 같은 묶음 안에서 순서 이동입니다.</p>
    </div>
  </div>
  </div>
</div>

<div class="status">
  <span class="pill" id="pillFs">파일시스템 ?</span>
  <span class="sel" id="selInfo">선택 없음</span>
  <span class="warn" id="warnInfo"></span>
  <span class="spacer" style="flex:1"></span>
  <span id="hint">파일을 열어 시작하세요</span>
</div>

<div class="toast" id="toast"></div>

<div class="copyright">
  © 2026 실꾸답연구소 | Silkkudap Lab. All rights reserved.<br>
  <span class="tagline">Keep doing. Keep going. That is the answer.</span>
</div>

<input type="file" id="filePick" accept=".html,.htm,text/html" hidden>
<input type="file" id="imgPick" accept="image/*" hidden>

<script>
/* ============================================================
   강의 HTML 편집기 — 부모 셸
   - File System Access API (열기+덮어쓰기 통합) / 다운로드 폴백
   - iframe 격리 렌더, 내부에 편집 런타임 + SortableJS 주입
============================================================ */

const PFX = "__led";                       // 주입 표식 접두사
const hasFS = "showOpenFilePicker" in window;

const $ = s => document.querySelector(s);
const frame   = $("#frame");
const empty   = $("#empty");
const stage   = $("#stage");
const toastEl = $("#toast");

let fileHandle = null;     // File System Access 핸들 (덮어쓰기용)
let fileName   = null;
let api        = null;     // iframe 내부 노출 API
let dirty      = false;

/* ── 브라우저 지원 표시 ── */
const pillFs = $("#pillFs");
if (hasFS){ pillFs.textContent = "직접 저장 지원"; pillFs.classList.add("on"); }
else      { pillFs.textContent = "다운로드만 가능"; }

/* ── 토스트 ── */
let toastT;
function toast(msg, err){
  toastEl.textContent = msg;
  toastEl.classList.toggle("err", !!err);
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(()=>toastEl.classList.remove("show"), 2200);
}

/* ── 드롭다운 메뉴 ── */
document.querySelectorAll(".menu").forEach(m=>{
  const trigger = m.querySelector(".tb");
  trigger.addEventListener("click", e=>{
    if (trigger.disabled) return;
    e.stopPropagation();
    document.querySelectorAll(".menu").forEach(x=>x!==m && x.classList.remove("open"));
    m.classList.toggle("open");
  });
});
document.addEventListener("click", ()=>document.querySelectorAll(".menu").forEach(m=>m.classList.remove("open")));

/* ============================================================
   파일 열기
============================================================ */
$("#btnOpen").addEventListener("click", openFile);
$("#filePick").addEventListener("change", e=>{
  const f = e.target.files[0];
  if (f) f.text().then(t=>loadDoc(t, f.name));
  e.target.value = "";
});

async function openFile(){
  if (hasFS){
    try{
      const [h] = await window.showOpenFilePicker({
        types:[{description:"HTML", accept:{"text/html":[".html",".htm"]}}]
      });
      fileHandle = h;
      const f = await h.getFile();
      loadDoc(await f.text(), f.name);
    }catch(err){ if (err.name!=="AbortError") toast("열기 실패: "+err.message, true); }
  } else {
    $("#filePick").click();
  }
}

/* 드래그&드롭 */
["dragenter","dragover"].forEach(ev=>stage.addEventListener(ev, e=>{
  e.preventDefault(); empty.classList.add("drag");
}));
["dragleave","drop"].forEach(ev=>stage.addEventListener(ev, e=>{
  e.preventDefault(); if (ev==="drop"||e.target===empty) empty.classList.remove("drag");
}));
stage.addEventListener("drop", e=>{
  const f = e.dataTransfer.files[0];
  if (!f) return;
  fileHandle = null;             // DnD 파일은 직접 저장 핸들 없음 → 다운로드만
  f.text().then(t=>loadDoc(t, f.name));
});

/* ============================================================
   문서 로드 → iframe 주입
============================================================ */
function loadDoc(html, name){
  fileName = name || "lecture.html";
  $("#fname").textContent = fileName;
  api = null;
  resetSlides();

  // 외부 참조 경고 〔확인〕: srcdoc 환경에선 상대경로 리소스가 로드되지 않음
  const ext = /<(?:link|script|img)[^>]+(?:href|src)\s*=\s*["'](?!https?:|data:|#)/i.test(html);
  $("#warnInfo").textContent = ext
    ? "외부/상대경로 리소스 감지 — 미리보기에서 일부 스타일·이미지가 빠질 수 있음"
    : "";

  frame.srcdoc = html;
  frame.onload = ()=>injectRuntime();
  empty.style.display = "none";
  setDirty(false);
}

/* iframe 내부에 SortableJS + 편집 런타임 주입 */
function injectRuntime(){
  const idoc = frame.contentDocument;
  const iwin = frame.contentWindow;
  if (!idoc) return;

  // 1) SortableJS — 인라인 소스를 동기 주입 (CDN/네트워크 의존 없음)
  const src = document.getElementById("__sortableSrc").textContent;
  const s = idoc.createElement("script");
  s.id = PFX + "_sortable";
  s.textContent = src;
  idoc.body.appendChild(s);            // 동기 실행

  const sortOK = !!iwin.Sortable;      // 강의 HTML의 CSP가 inline을 막으면 false

  // 2) 편집 런타임
  const r = idoc.createElement("script");
  r.id = PFX + "_runtime";
  r.textContent = "(" + RUNTIME.toString() + ")(\"" + PFX + "\");";
  idoc.body.appendChild(r);

  if (!iwin[PFX + "_API"]){
    toast("편집 런타임 초기화 실패 — 강의 파일에 CSP(콘텐츠 보안 정책)가 있는지 확인하세요", true);
    return;
  }

  // 3) 연결
  api = iwin[PFX + "_API"];
  // RUNTIME은 win.parent[...] 에서 콜백을 찾으므로 부모 window에 설정해야 함
  window[PFX + "_onChange"] = onChildChange;
  window[PFX + "_onSelect"] = onChildSelect;
  api.init();
  toast(sortOK ? "편집 준비 완료" : "편집 준비 완료 — 드래그 정렬만 비활성(버튼 이동은 가능)", !sortOK);
  $("#hint").textContent = sortOK
    ? "클릭=선택 · 더블클릭=텍스트편집 · 드래그=순서이동"
    : "클릭=선택 · 더블클릭=텍스트편집 · ▲▼ 버튼=순서이동";
  enableShell(true);
  setupSlides();
}

function cleanHTML(){ return api ? api.getCleanHTML() : ""; }

async function saveOverwrite(){
  if (!api) return;
  if (!hasFS || !fileHandle){
    toast("이 파일은 직접 저장 불가 — 다운로드로 저장합니다", true);
    return saveDownload();
  }
  try{
    const w = await fileHandle.createWritable();
    await w.write(cleanHTML());
    await w.close();
    setDirty(false);
    toast("저장됨 → " + fileName);
  }catch(err){ toast("저장 실패: "+err.message, true); }
}

function saveDownload(){
  if (!api) return;
  const blob = new Blob([cleanHTML()], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName.replace(/(\.html?)?$/i, "") + ".edited.html";
  a.click();
  URL.revokeObjectURL(a.href);
  setDirty(false);
  toast("다운로드됨 → " + a.download);
}

/* ============================================================
   슬라이드 미리보기 패널 (PPT 스타일)
   - iframe 안의 슬라이드(<section class="slide"> 등)를 자동 감지
   - 좌측에 16:9 썸네일 생성, 클릭 시 해당 슬라이드로 이동
   - 강의 덱은 vw/vh/cqw 단위로 스스로 축소되므로 작은 iframe이 곧 썸네일
============================================================ */
const sbList   = $("#sbList");
const sbCount  = $("#sbCount");
const slidebar = $("#slidebar");
let slideEls = [], slideSel = "", activeClass = null, cur = 0;
let thumbT = null;

// 여러 덱 포맷에 대응하는 슬라이드 감지
function detectSlides(){
  const idoc = frame.contentDocument;
  slideEls = []; slideSel = ""; activeClass = null;
  if (!idoc) return;
  const cands = [".reveal .slides>section","section.slide",".slide",
                 ".slides>section",".slides>.slide","section[class*=slide]",
                 "[class*=slide]","section"];
  for (const sel of cands){
    let els;
    try{ els = [...idoc.querySelectorAll(sel)]; }catch(_){ continue; }
    if (els.length >= 2){ slideEls = els; slideSel = sel; break; }
  }
  if (!slideEls.length) return;
  if (!activeClass) activeClass = detectActiveClass(slideEls);
  const win = frame.contentWindow;
  let idx = slideEls.findIndex(e => activeClass
      ? e.classList.contains(activeClass)
      : (win.getComputedStyle(e).display !== "none"));
  cur = idx < 0 ? 0 : idx;
  slidebar.style.setProperty("--ar-pad", measureAR());
}

// 보이는 슬라이드의 실측 비율 → 썸네일 비율에 반영
function measureAR(){
  const win = frame.contentWindow;
  const base = slideEls[cur]
      || slideEls.find(e => win.getComputedStyle(e).display !== "none")
      || slideEls[0];
  const probe = (base && base.parentElement) || base;   // 슬라이드를 감싸는 무대(stage)
  if (probe){
    const r = probe.getBoundingClientRect();
    if (r.width > 4 && r.height > 4){
      let ar = r.width / r.height;
      ar = Math.min(5, Math.max(0.2, ar));
      return (100 / ar).toFixed(3) + "%";               // padding-top 절대값
    }
  }
  return "56.25%";
}

// 'active' 클래스 추정: ① 흔한 활성 클래스명 우선 ② 없으면 보이는 슬라이드에만 있는 고유 클래스
function detectActiveClass(els){
  const win = frame.contentWindow;
  const vis = els.find(e => win.getComputedStyle(e).display !== "none") || els[0];
  if (!vis) return null;
  const KNOWN = ["active","current","present","is-active","is-current",
                 "selected","show","shown","on","visible"];
  for (const c of KNOWN){ if (vis.classList.contains(c)) return c; }
  return null;
}

// 썸네일 iframe 안에 "idx번 슬라이드만 표시" 주입
function thumbInject(idx){
  const sel = JSON.stringify(slideSel);
  const ac  = JSON.stringify(activeClass);
  return '<style>*{animation:none!important;transition:none!important}'
       + '.nav,.dots,.hint,nav{display:none!important}'
       + 'html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;'
       +   'overflow:hidden!important;cursor:default!important}'
       + '#__thumbstage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;'
       +   'max-width:none!important;max-height:none!important;min-width:0!important;min-height:0!important;'
       +   'margin:0!important;box-shadow:none!important;border-radius:0!important;transform:none!important}'
       + '</style>'
       + '<script>(function(){try{var els=document.querySelectorAll(' + sel + ');'
       + 'if(!els.length)return;var ac=' + ac + ',ix=' + idx + ';'
       + 'els.forEach(function(s,k){if(ac){s.classList.toggle(ac,k===ix);}'
       + 'else{s.style.display=(k===ix?"flex":"none");}});'
       + 'var st=els[ix]&&els[ix].parentElement; if(st){st.id="__thumbstage";}'
       + '}catch(e){}})();<\/script>';
}
function thumbDoc(idx){
  const html = api ? api.getCleanHTML() : "";
  return html.replace(/<\/body>/i, thumbInject(idx) + "</body>");
}

function setupSlides(){
  detectSlides();
  if (!slideEls.length){
    slidebar.classList.add("hidden");
    $("#btnSidebar").disabled = true;
    return;
  }
  $("#btnSidebar").disabled = false;
  slidebar.classList.remove("hidden");
  buildThumbs();
}

let dragFrom = null;

function buildThumbs(){
  sbList.innerHTML = "";
  slideEls.forEach((el, i) => {
    const item = document.createElement("div");
    item.className = "sb-item" + (i === cur ? " active" : "");
    item.dataset.i = i;
    item.draggable = true;
    item.innerHTML =
        '<span class="sb-num">' + (i + 1) + '</span>'
      + '<div class="sb-tools">'
      +   '<button data-op="up" title="위로 이동">▲</button>'
      +   '<button data-op="down" title="아래로 이동">▼</button>'
      +   '<button class="del" data-op="del" title="슬라이드 삭제">✕</button>'
      + '</div>'
      + '<div class="sb-thumb"><iframe sandbox="allow-same-origin allow-scripts" loading="lazy"></iframe></div>';
    item.querySelector("iframe").srcdoc = thumbDoc(i);
    item.addEventListener("click", () => goTo(i, true));
    // 도구 버튼(삭제/위·아래 이동)
    item.querySelectorAll(".sb-tools button").forEach(b => {
      b.addEventListener("click", e => {
        e.stopPropagation();
        const op = b.dataset.op;
        if (op === "up") moveSlide(i, -1);
        else if (op === "down") moveSlide(i, 1);
        else if (op === "del") delSlide(i);
      });
    });
    // 드래그로 순서 변경
    item.addEventListener("dragstart", e => {
      dragFrom = i; item.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try{ e.dataTransfer.setData("text/plain", String(i)); }catch(_){}
    });
    item.addEventListener("dragend", () => {
      item.classList.remove("dragging");
      sbList.querySelectorAll(".drag-over").forEach(x => x.classList.remove("drag-over"));
    });
    item.addEventListener("dragover", e => {
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      item.classList.add("drag-over");
    });
    item.addEventListener("dragleave", () => item.classList.remove("drag-over"));
    item.addEventListener("drop", e => {
      e.preventDefault(); item.classList.remove("drag-over");
      if (dragFrom != null && dragFrom !== i) moveSlideTo(dragFrom, i);
      dragFrom = null;
    });
    sbList.appendChild(item);
  });
  sbCount.textContent = slideEls.length + "장";
  highlightThumb();
}

/* ── 슬라이드 삭제 / 순서 변경 (편집기 undo와 연동, 저장 시 반영) ── */
function delSlide(i){
  if (!api || !slideEls[i]) return;
  if (!confirm((i + 1) + "번 슬라이드를 삭제할까요?")) return;
  api.removeNode(slideEls[i]);
  afterStructureChange(i > 0 ? i - 1 : 0);
}
function moveSlide(i, dir){
  const j = i + dir;
  if (!api || j < 0 || j >= slideEls.length) return;
  if (dir < 0) api.moveNodeRel(slideEls[i], slideEls[i - 1]);
  else         api.moveNodeRel(slideEls[i], slideEls[i + 2] || null);
  afterStructureChange(j);
}
function moveSlideTo(from, to){
  if (!api || from === to || !slideEls[from]) return;
  const node = slideEls[from];
  const ref  = to > from ? (slideEls[to + 1] || null) : slideEls[to];
  api.moveNodeRel(node, ref);
  afterStructureChange(to);
}
function afterStructureChange(targetIdx){
  detectSlides();
  if (!slideEls.length){ resetSlides(); return; }
  cur = Math.max(0, Math.min(slideEls.length - 1, targetIdx));
  goTo(cur);
  buildThumbs();
}

function refreshThumb(i){
  const item = sbList.querySelector('.sb-item[data-i="' + i + '"]');
  if (!item) return;
  const fr = item.querySelector("iframe");
  if (fr) fr.srcdoc = thumbDoc(i);
}

function highlightThumb(){
  sbList.querySelectorAll(".sb-item").forEach(it =>
    it.classList.toggle("active", Number(it.dataset.i) === cur));
  const act = sbList.querySelector(".sb-item.active");
  if (act) act.scrollIntoView({ block: "nearest" });
}

// 썸네일 클릭 → 해당 슬라이드로 이동(편집 화면 전환)
function goTo(i, fromClick){
  if (!slideEls.length) return;
  cur = Math.max(0, Math.min(slideEls.length - 1, i));
  slideEls.forEach((s, k) => {
    if (activeClass) s.classList.toggle(activeClass, k === cur);
    else s.style.display = (k === cur ? "flex" : "none");
  });
  syncDeckUI();
  highlightThumb();
}

// 덱에 카운터/도트가 있으면 함께 갱신(있을 때만)
function syncDeckUI(){
  const idoc = frame.contentDocument; if (!idoc) return;
  const counter = idoc.getElementById("counter");
  if (counter) counter.textContent = (cur + 1) + " / " + slideEls.length;
  const dots = idoc.querySelectorAll(".dots > *");
  if (dots.length === slideEls.length)
    dots.forEach((d, k) => d.classList.toggle("on", k === cur));
}

// 편집 후 썸네일 갱신(장수 변동=전체 재생성 / 내용 변동=현재 장만)
function scheduleThumbRefresh(){
  clearTimeout(thumbT);
  thumbT = setTimeout(() => {
    if (!api) return;
    const prev = slideEls.length;
    detectSlides();
    if (!slideEls.length){
      slidebar.classList.add("hidden");
      $("#btnSidebar").disabled = true;
      return;
    }
    if (slideEls.length !== prev) buildThumbs();
    else { refreshThumb(cur); highlightThumb(); }
  }, 500);
}

function resetSlides(){
  clearTimeout(thumbT);
  slideEls = []; slideSel = ""; activeClass = null; cur = 0;
  sbList.innerHTML = ""; sbCount.textContent = "";
  slidebar.classList.add("hidden");
  $("#btnSidebar").disabled = true;
}

// 패널 토글
$("#btnSidebar").addEventListener("click", () => {
  if (!slideEls.length) return;
  slidebar.classList.toggle("hidden");
});

/* 단축키 */
document.addEventListener("keydown", e=>{
  const c = e.ctrlKey || e.metaKey;
  if (!c) return;
  const k = e.key.toLowerCase();
  if (k==="s"){ e.preventDefault(); e.shiftKey ? saveDownload() : saveOverwrite(); }
  else if (k==="z" && !e.shiftKey){ e.preventDefault(); api && api.undo(); }
  else if ((k==="y") || (k==="z" && e.shiftKey)){ e.preventDefault(); api && api.redo(); }
});

/* ============================================================
   ★ iframe 내부에서 실행되는 편집 런타임
     (문자열화되어 자식 document에 주입됨 — 부모 스코프 참조 금지)
============================================================ */
function RUNTIME(PFX){
  const doc = document, win = window;
  const BLOCKS = "p,h1,h2,h3,h4,h5,h6,ul,ol,li,img,table,blockquote,pre,figure,hr,section,article,aside,header,footer,div";
  const notify = (...a)=>{ const f = win.parent[PFX+"_onChange"]; f && f(...a); };
  const notifySel = (i)=>{ const f = win.parent[PFX+"_onSelect"]; f && f(i); };

  let sel = null;       // 선택된 요소
  let editing = false;  // 텍스트 편집 중 여부
  const undoStack = [], redoStack = [];
  const LIMIT = 60;

  /* ── 주입 스타일 ── */
  const st = doc.createElement("style");
  st.id = PFX + "_style";
  st.textContent = `
    [${PFX}-sel]{outline:2px solid #4c8bf5 !important; outline-offset:1px; cursor:grab;}
    [${PFX}-edit]{outline:2px dashed #3fb27f !important; cursor:text; min-height:1em;}
    .sortable-ghost{opacity:.35;}
    .sortable-chosen{outline:2px solid #4c8bf5 !important;}
    [${PFX}-hl]{background:rgba(76,139,245,.08); transition:background .1s;}
    #${PFX}_rh{position:absolute; width:14px; height:14px; background:#4c8bf5;
      border:2px solid #fff; border-radius:3px; box-shadow:0 1px 4px rgba(0,0,0,.4);
      cursor:nwse-resize; z-index:2147483647; display:none; touch-action:none;}
  `;
  doc.head.appendChild(st);

  /* ── 헬퍼 ── */
  function isBlock(el){ return el && el.nodeType===1 && el.matches && el.matches(BLOCKS); }
  // 클릭 지점에서 가장 가까운 "의미 있는" 블록 (최상위 래퍼 div 회피)
  function pickBlock(el){
    let cur = el;
    while (cur && cur !== doc.body){
      if (isBlock(cur)){
        // div는 자식 블록이 없을 때(=말단 콘텐츠)만 선택 대상으로
        if (cur.tagName==="DIV"){
          const hasBlockChild = [...cur.children].some(c=>isBlock(c) && c.tagName!=="BR");
          if (hasBlockChild){ cur = cur.parentElement; continue; }
        }
        return cur;
      }
      cur = cur.parentElement;
    }
    return null;
  }
  function isImg(el){ return el && el.tagName === "IMG"; }
  function imgW(el){ return el ? el.getBoundingClientRect().width : 0; }
  function isCentered(el){ return !!el && el.style.marginLeft==="auto" && el.style.marginRight==="auto"; }
  function tagInfo(el){
    if (!el) return null;
    return { tag: el.tagName.toLowerCase(), editing, img: isImg(el),
             w: isImg(el)?imgW(el):0, centered: isImg(el)?isCentered(el):false };
  }

  /* ── 선택 ── */
  function clearSel(){
    if (sel){ sel.removeAttribute(PFX+"-sel"); }
    if (editing) stopEdit();
    sel = null; hideHandle(); notifySel(null);
  }
  function setSel(el){
    if (sel===el) return;
    clearSel();
    sel = el; el.setAttribute(PFX+"-sel","");
    if (isImg(el)) showHandle(); else hideHandle();
    notifySel(tagInfo(el));
  }

  /* ── 이미지 리사이즈 핸들 ── */
  const rh = doc.createElement("div");
  rh.id = PFX + "_rh";
  doc.body.appendChild(rh);
  let resizing = false, rStartX = 0, rStartW = 0, rRatio = 1, rSnap = null;

  function positionHandle(){
    if (!isImg(sel)) return;
    const r = sel.getBoundingClientRect();
    rh.style.left = (r.right + win.scrollX - 7) + "px";
    rh.style.top  = (r.bottom + win.scrollY - 7) + "px";
  }
  function showHandle(){ rh.style.display = "block"; positionHandle(); }
  function hideHandle(){ rh.style.display = "none"; }

  rh.addEventListener("pointerdown", e=>{
    if (!isImg(sel)) return;
    e.preventDefault(); e.stopPropagation();
    resizing = true; rSnap = snap();
    rStartX = e.clientX; rStartW = sel.getBoundingClientRect().width;
    const nW = sel.naturalWidth || rStartW, nH = sel.naturalHeight || rStartW;
    rRatio = nW ? nH / nW : 1;
    rh.setPointerCapture(e.pointerId);
    doc.addEventListener("pointermove", onResize);
    doc.addEventListener("pointerup", endResize);
  });
  function onResize(e){
    if (!resizing) return;
    let w = Math.max(20, Math.round(rStartW + (e.clientX - rStartX)));
    sel.style.width = w + "px";
    sel.style.height = "auto";
    positionHandle();
    notifySel(tagInfo(sel));   // 부모 입력값 실시간 갱신
  }
  function endResize(){
    resizing = false;
    doc.removeEventListener("pointermove", onResize);
    doc.removeEventListener("pointerup", endResize);
    if (rSnap != null && snap() !== rSnap){ pushUndo(rSnap); notify(); }
    rSnap = null;
  }
  // 스크롤/리플로우 시 핸들 위치 유지
  win.addEventListener("scroll", positionHandle, true);
  win.addEventListener("resize", positionHandle);

  /* ── 이미지 너비 API ── */
  function setImgWidth(px){
    if (!isImg(sel)) return;
    const before = snap();
    sel.style.width = Math.max(20, px) + "px"; sel.style.height = "auto";
    positionHandle();
    if (snap() !== before){ pushUndo(before); notify(); }
    notifySel(tagInfo(sel));
  }
  function scaleImg(f){
    if (!isImg(sel)) return;
    setImgWidth(Math.round(sel.getBoundingClientRect().width * f));
  }
  function resetImg(){
    if (!isImg(sel)) return;
    const before = snap();
    sel.style.removeProperty("width"); sel.style.removeProperty("height");
    if (sel.getAttribute("style")==="") sel.removeAttribute("style");
    positionHandle();
    if (snap() !== before){ pushUndo(before); notify(); }
    notifySel(tagInfo(sel));
  }
  function curImgWidth(){ return isImg(sel) ? sel.getBoundingClientRect().width : 0; }
  function toggleImgCenter(){
    if (!isImg(sel)) return;
    const before = snap();
    if (isCentered(sel)){
      sel.style.removeProperty("display");
      sel.style.removeProperty("margin-left");
      sel.style.removeProperty("margin-right");
    } else {
      sel.style.display = "block";
      sel.style.marginLeft = "auto";
      sel.style.marginRight = "auto";
    }
    if (sel.getAttribute("style")==="") sel.removeAttribute("style");
    positionHandle();
    if (snap() !== before){ pushUndo(before); notify(); }
    notifySel(tagInfo(sel));
  }

  /* ── 텍스트 편집 ── */
  function startEdit(){
    if (!sel || editing) return;
    if (sel.matches("img,hr")) return;        // 비텍스트 요소
    editing = true;
    sel.setAttribute(PFX+"-edit","");
    sel.setAttribute("contenteditable","true");
    sel.focus();
    // 끝으로 캐럿
    const r = doc.createRange(); r.selectNodeContents(sel); r.collapse(false);
    const s = win.getSelection(); s.removeAllRanges(); s.addRange(r);
    notifySel(tagInfo(sel));
  }
  function stopEdit(){
    if (!editing) return;
    editing = false;
    if (sel){
      sel.removeAttribute("contenteditable");
      sel.removeAttribute(PFX+"-edit");
    }
    notifySel(tagInfo(sel));
  }

  /* ── 이벤트 ──
     ⚠ 슬라이드(프레젠테이션) HTML은 클릭·방향키·스페이스로 화면을 넘기는
        자체 스크립트를 갖고 있어, 편집 중 화면이 멋대로 넘어가는 문제가 생긴다.
        그래서 클릭/키 이벤트를 window '캡처 단계'에서 먼저 가로채
        강의 덱의 네비게이션으로 전파되지 않도록 막는다.
        (드래그 정렬용 SortableJS와 이미지 리사이즈 핸들은 mousedown/pointerdown을
         사용하므로 그 이벤트는 건드리지 않아 정상 동작한다.) */

  // 클릭 = 선택. 덱의 "클릭 → 다음 슬라이드"는 차단.
  win.addEventListener("click", e=>{
    if (e.target === rh) return;             // 이미지 리사이즈 핸들 클릭은 통과
    e.stopImmediatePropagation();            // 덱으로 전파 차단
    if (editing) return;                     // 편집 중엔 캐럿 이동(기본동작) 유지
    const blk = pickBlock(e.target);
    if (blk){ e.preventDefault(); setSel(blk); }
    else clearSel();
  }, true);

  // 더블클릭 = 텍스트 편집.
  win.addEventListener("dblclick", e=>{
    e.stopImmediatePropagation();
    const blk = pickBlock(e.target);
    if (blk){ e.preventDefault(); setSel(blk); startEdit(); }
  }, true);

  // 키보드: 슬라이드 이동키(방향키·스페이스·PageUp/Down·Home/End)는 덱으로 못 가게 차단.
  const NAV_KEYS = new Set([
    "ArrowLeft","ArrowRight","ArrowUp","ArrowDown",
    "PageUp","PageDown","Home","End"," ","Spacebar"
  ]);
  function onKey(e){
    if (editing){
      e.stopPropagation();                   // 입력 중엔 덱 전파만 차단(타이핑·캐럿은 정상)
      if (e.type==="keydown" && e.key==="Escape"){ e.preventDefault(); commitEdit(); }
      return;
    }
    if (NAV_KEYS.has(e.key)){ e.preventDefault(); e.stopPropagation(); }   // 화면 넘김 차단
    if (e.type==="keydown" && e.key==="Delete" && sel){ e.preventDefault(); del(); }
  }
  ["keydown","keyup","keypress"].forEach(t=>win.addEventListener(t, onKey, true));

  // 휠로 넘어가는 덱 대응: 전파만 차단(네이티브 스크롤은 유지)
  win.addEventListener("wheel", e=>{ e.stopPropagation(); }, true);
  // 편집 종료 시 변경 커밋
  doc.addEventListener("focusout", e=>{
    if (editing && e.target===sel) commitEdit();
  }, true);
  let editSnapshot=null;
  function commitEdit(){
    const before = editSnapshot;
    stopEdit();
    if (before!=null && before!==doc.body.innerHTML){ pushUndo(before); notify(); }
    editSnapshot=null;
  }

  /* ── 변경 전 스냅샷 (undo) ── */
  function snap(){ return doc.body.innerHTML; }
  function pushUndo(html){
    undoStack.push(html); if (undoStack.length>LIMIT) undoStack.shift();
    redoStack.length = 0;
  }
  function mutate(fn){
    const before = snap();
    fn();
    if (snap()!==before){ pushUndo(before); notify(); }
    initSortables();
  }

  /* ── 조작 ── */
  function del(){
    if (!sel) return;
    mutate(()=>{ const p=sel; clearSel(); p.remove(); });
  }
  function dup(){
    if (!sel) return;
    mutate(()=>{ const c=sel.cloneNode(true);
      c.removeAttribute(PFX+"-sel"); sel.after(c); });
  }
  function moveUp(){
    if (!sel) return; const prev = sel.previousElementSibling;
    if (prev) mutate(()=>sel.parentNode.insertBefore(sel, prev));
  }
  function moveDown(){
    if (!sel) return; const next = sel.nextElementSibling;
    if (next) mutate(()=>sel.parentNode.insertBefore(next, sel));
  }
  function insert(kind){
    if (!sel) return;
    let el;
    switch(kind){
      case "h2": el=mk("h2","제목을 입력하세요"); break;
      case "h3": el=mk("h3","소제목을 입력하세요"); break;
      case "p":  el=mk("p","문단 내용을 입력하세요"); break;
      case "ul": el=doc.createElement("ul"); el.innerHTML="<li>항목 1</li><li>항목 2</li>"; break;
      case "img":{ el=doc.createElement("img");
        const u=win.prompt("이미지 URL을 입력하세요","https://"); if(!u) return;
        el.src=u; el.alt=""; el.style.maxWidth="100%"; break; }
      case "hr": el=doc.createElement("hr"); break;
    }
    if (!el) return;
    mutate(()=>sel.after(el));
    setSel(el);
  }
  function mk(tag,text){ const e=doc.createElement(tag); e.textContent=text; return e; }

  // 로컬 이미지: base64 data URI를 그대로 임베드 → 단일 파일 자체완결
  function insertImage(dataURI){
    if (!sel || !dataURI) return;
    const el = doc.createElement("img");
    el.src = dataURI; el.alt = "";
    el.style.maxWidth = "100%";
    el.addEventListener("load", ()=>{ if (sel===el){ positionHandle(); notifySel(tagInfo(el)); } });
    mutate(()=>sel.after(el));
    setSel(el);
  }

  /* ── undo / redo ── */
  function undo(){
    if (!undoStack.length) return;
    redoStack.push(snap());
    doc.body.innerHTML = undoStack.pop();
    afterRestore();
  }
  function redo(){
    if (!redoStack.length) return;
    undoStack.push(snap());
    doc.body.innerHTML = redoStack.pop();
    afterRestore();
  }
  function afterRestore(){ sel=null; editing=false; hideHandle(); notifySel(null); initSortables(); notify(); }

  /* ── SortableJS (부모 컨테이너 내 한정) ── */
  let sortables = [];
  function initSortables(){
    sortables.forEach(s=>{ try{s.destroy();}catch(_){} });
    sortables = [];
    if (!win.Sortable) return;
    // 직계 자식 중 블록이 2개 이상인 컨테이너만 정렬 대상
    const conts = new Set();
    doc.body.querySelectorAll(BLOCKS).forEach(b=>{
      const p = b.parentElement;
      if (!p) return;
      const n = [...p.children].filter(c=>isBlock(c)).length;
      if (n>=2) conts.add(p);
    });
    conts.add(doc.body);
    conts.forEach(c=>{
      sortables.push(win.Sortable.create(c, {
        animation:150,
        forceFallback:true, fallbackOnBody:true, fallbackTolerance:4,
        delay:120, delayOnTouchOnly:true,
        filter:"[contenteditable='true'],#"+PFX+"_rh", preventOnFilter:false,
        onStart:()=>{ if(editing) commitEdit(); },
        onEnd:(ev)=>{ if (ev.oldIndex!==ev.newIndex){ pushUndo(lastSnapBeforeDrag); notify(); } }
      }));
    });
  }
  // 드래그 직전 스냅샷 확보
  let lastSnapBeforeDrag = "";
  doc.addEventListener("pointerdown", ()=>{ lastSnapBeforeDrag = snap(); }, true);

  /* ── 슬라이드 패널용: 노드 단위 조작(undo 연동) ── */
  function removeNode(el){
    if (!el) return;
    mutate(()=>{ if (sel===el) clearSel(); el.remove(); });
  }
  function moveNodeRel(node, ref){
    if (!node) return;
    mutate(()=>{
      const p = node.parentNode; if (!p) return;
      if (ref && ref.parentNode === p) p.insertBefore(node, ref);
      else p.appendChild(node);
    });
  }

  /* ── 저장용 정리 HTML ── */
  function getCleanHTML(){
    const clone = doc.documentElement.cloneNode(true);
    // 주입물 제거
    clone.querySelectorAll("#"+PFX+"_style, #"+PFX+"_runtime, #"+PFX+"_sortable, #"+PFX+"_rh").forEach(n=>n.remove());
    // 편집 흔적 속성 제거
    clone.querySelectorAll("*").forEach(n=>{
      n.removeAttribute(PFX+"-sel");
      n.removeAttribute(PFX+"-edit");
      n.removeAttribute(PFX+"-hl");
      n.removeAttribute("contenteditable");
      ["sortable-ghost","sortable-chosen","sortable-drag","sortable-fallback"]
        .forEach(c=>n.classList && n.classList.remove(c));
      if (n.classList && n.classList.length===0) n.removeAttribute("class");
    });
    const dt = doc.doctype ? "<!DOCTYPE "+doc.doctype.name+">\n" : "<!DOCTYPE html>\n";
    return dt + clone.outerHTML;
  }

  /* ── 외부 노출 API ── */
  win[PFX+"_API"] = {
    init(){ initSortables(); },
    editText:startEdit, moveUp, moveDown, duplicate:dup, delete:del,
    insert, insertImage, undo, redo,
    setImgWidth, scaleImg, resetImg, toggleImgCenter, imgWidth:curImgWidth,
    history:()=>({canUndo:undoStack.length>0, canRedo:redoStack.length>0}),
    removeNode, moveNodeRel,
    getCleanHTML
  };
  // 텍스트 편집 진입 시 스냅샷 기록
  const _start = startEdit;
  startEdit = function(){ editSnapshot = snap(); _start(); };
  win[PFX+"_API"].editText = startEdit;
}
</script>
</body>
</html>
